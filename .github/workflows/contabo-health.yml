name: Contabo Universal Web

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operacion a ejecutar"
        required: true
        type: choice
        options:
          - health
          - prepare-051
          - validate-051
          - backup-status
          - test-051
          - functional-051-status

permissions:
  contents: read

concurrency:
  group: contabo-deployment
  cancel-in-progress: false

jobs:
  contabo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CONTABO_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/contabo_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/contabo_deploy > /dev/null

      - name: Execute authorized operation
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -eu
          case "$OPERATION" in
            health|prepare-051|validate-051|backup-status|test-051|functional-051-status) ;;
            *) exit 64 ;;
          esac
          ssh -n -T -i ~/.ssh/contabo_deploy \
            -o ClearAllForwardings=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            deploy@155.133.198.70 "$OPERATION"



name: Contabo SSH health check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CONTABO_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/contabo_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/contabo_deploy > /dev/null

      - name: Check Contabo connection
        run: |
          ssh -i ~/.ssh/contabo_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            deploy@155.133.198.70 health

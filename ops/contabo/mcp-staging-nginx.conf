# Run as the staging operator with a separate nginx -p directory.
worker_processes 1;
pid nginx.pid;
error_log error.log warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path client-body;
    proxy_temp_path proxy-temp;
    client_max_body_size 64k;

    server {
        listen 127.0.0.1:8182 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 127.0.0.1:8182;
        server_name mcp-staging.carlosbarcelo.es;

        proxy_set_header Host mcp-staging.carlosbarcelo.es;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host mcp-staging.carlosbarcelo.es;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header Cookie "";

        location = /mcp/chatgpt {
            proxy_pass http://127.0.0.1:8181/mcp/chatgpt;
        }
        location = /.well-known/oauth-protected-resource/mcp/chatgpt {
            proxy_pass http://127.0.0.1:8181/.well-known/oauth-protected-resource/mcp/chatgpt;
        }
        location / { return 404; }
    }

    server {
        listen 127.0.0.1:8182;
        server_name auth-staging.carlosbarcelo.es;

        proxy_set_header Host auth-staging.carlosbarcelo.es;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host auth-staging.carlosbarcelo.es;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";

        location = /.well-known/oauth-authorization-server/realms/uw-mcp-staging {
            proxy_pass http://127.0.0.1:8180/.well-known/oauth-authorization-server/realms/uw-mcp-staging;
        }
        location = /realms/uw-mcp-staging/.well-known/openid-configuration {
            proxy_pass http://127.0.0.1:8180/realms/uw-mcp-staging/.well-known/openid-configuration;
        }
        location ~ ^/realms/uw-mcp-staging/protocol/openid-connect/(auth|token|token/introspect|certs|userinfo)$ {
            proxy_pass http://127.0.0.1:8180;
        }
        location ^~ /realms/uw-mcp-staging/login-actions/ {
            proxy_pass http://127.0.0.1:8180/realms/uw-mcp-staging/login-actions/;
        }
        location ^~ /resources/ {
            proxy_pass http://127.0.0.1:8180/resources/;
        }
        location / { return 404; }
    }
}
